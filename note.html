<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta property="og:url" content="https://irisinhere.github.io/irisshare/note.html">
<meta property="og:image" content="https://irisinhere.github.io/irisshare/assets/img/og-cover.png">
<title>IrisShare · A lifelong learner · 笔记</title>
<script>try{const t=localStorage.getItem('irisshare-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="assets/css/site.css?v=20260817b">
<link rel="stylesheet" href="assets/css/iris-note.css">
<link rel="stylesheet" href="assets/js/lib/katex/katex.min.css">
<link id="hljs-theme" rel="stylesheet" href="assets/css/hljs-light.css">
</head>
<body>
<header class="site-header"><div class="inner">
  <a class="brand" href="index.html">IrisShare<small>A lifelong learner</small></a>
  <nav class="nav">
    <a href="index.html">首页</a>
    <a href="notes.html">阅读笔记</a>
    <a href="ai-finance.html">AI财务</a>
  </nav>
  <div class="tools"><button class="icon-btn" id="themeToggle" title="切换深色 / 浅色">☾</button></div>
</div></header>

<main class="reader">
  <div class="toc-drawer" id="tocDrawer">
    <aside id="toc"></aside>
    <div class="toc-tools">
      <span class="toc-tools-label">字号</span>
      <div class="grp">
        <button id="fontDec" title="缩小字号">A−</button>
        <span class="lbl" id="fontLabel">18px</span>
        <button id="fontInc" title="放大字号">A+</button>
        <button id="fontReset" title="恢复默认">重置</button>
      </div>
    </div>
    <button class="toc-fab" id="tocFab" aria-expanded="false" aria-label="展开 / 收起目录" title="展开 / 收起目录">
      <svg class="toc-fab-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 5 L15 12 L9 19"/>
        <path d="M15 5 L21 12 L15 19"/>
      </svg>
    </button>
  </div>
  <div class="note-col">
    <div class="note-meta" id="noteMeta" style="display:none"></div>
    <article class="note-content" id="noteBody"><p style="color:var(--text-soft)">加载中…</p></article>
  </div>
</main>

<footer class="site-footer"><div class="inner">
  <span>© 2026 IrisShare</span>
  <span>自洽 · 自爱 · 自由</span>
</div></footer>
<script src="assets/js/lib/marked.umd.js"></script>

<script src="assets/js/md-render.js?v=20260817b"></script>
<script src="assets/js/site.js?v=20260817b"></script>
<script>
  const params=new URLSearchParams(location.search);
  const file=params.get('file');
  if(file && window.renderNote) renderNote(file);
  else document.getElementById('noteBody').innerHTML='<p style="color:var(--em)">未指定笔记文件。</p>';
</script>
</body></html>
